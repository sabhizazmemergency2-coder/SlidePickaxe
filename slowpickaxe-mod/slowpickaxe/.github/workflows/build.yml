name: Build Mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Rendre gradlew exécutable
        run: chmod +x ./gradlew

      - name: Compiler le mod
        run: ./gradlew build

      - name: Upload du .jar
        uses: actions/upload-artifact@v4
        with:
          name: slowpickaxe-mod
          path: build/libs/*-1.0.0.jar
          if-no-files-found: error
